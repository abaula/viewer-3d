[package]
name = "viewer-3d"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "viewer-3d"
path = "src/main.rs"

[dependencies]
env_logger = "0.11"
pollster = "0.4"
wgpu = "25.0.0"
winit = { version = "0.30.8", features = ["android-native-activity"] }
strum = "0.27"
strum_macros = "0.27"
bytemuck = { version = "1.16", features = [ "derive" ] }

